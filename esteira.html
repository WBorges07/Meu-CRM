<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Esteira de Vendas - CRM Elite</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <style>
        :root { 
            --bg-dark: #020617; --card-dark: #0f172a; --accent-blue: #38bdf8; 
            --border-color: #1e293b; --text-main: #f1f5f9; --whatsapp-green: #22c55e;
        }
        body { 
            background-color: var(--bg-dark); color: var(--text-main); 
            font-family: 'Inter', sans-serif; padding: 20px; overflow-x: auto;
        }
        .kanban-wrapper { display: flex; gap: 15px; padding-bottom: 20px; min-width: fit-content; }
        .kanban-column {
            width: 280px; background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--border-color); border-radius: 16px;
            display: flex; flex-direction: column; max-height: 85vh;
        }
        .column-header { padding: 15px; border-bottom: 1px solid var(--border-color); text-align: center; }
        .column-title { font-size: 0.75rem; font-weight: 800; text-transform: uppercase; color: var(--accent-blue); margin: 0; }
        .column-count { font-size: 0.65rem; color: #64748b; font-weight: 600; }
        .kanban-items { padding: 10px; overflow-y: auto; flex-grow: 1; min-height: 150px; }
        .kanban-card {
            background: var(--card-dark); border: 1px solid var(--border-color);
            border-radius: 12px; padding: 15px; margin-bottom: 12px;
            cursor: grab; transition: 0.2s; position: relative;
        }
        .kanban-card:hover { border-color: var(--accent-blue); transform: translateY(-2px); }
        .sortable-ghost { opacity: 0.3; border: 2px dashed var(--accent-blue); }
        .card-name { font-size: 0.9rem; font-weight: 700; margin-bottom: 8px; display: block; }
        .card-info { font-size: 0.7rem; color: #94a3b8; display: block; margin-bottom: 4px; }
        .label-mini { font-size: 0.6rem; text-transform: uppercase; font-weight: 800; color: #64748b; margin-right: 4px; }
        .whatsapp-btn {
            display: inline-flex; align-items: center; gap: 6px;
            background: rgba(34, 197, 94, 0.1); color: var(--whatsapp-green) !important;
            padding: 4px 10px; border-radius: 6px; text-decoration: none;
            font-size: 0.75rem; font-weight: 700; margin: 8px 0; transition: 0.3s;
            border: 1px solid rgba(34, 197, 94, 0.2);
        }
        .whatsapp-btn:hover { background: var(--whatsapp-green); color: white !important; }
        .card-value { font-size: 0.8rem; font-weight: 700; color: var(--accent-blue); margin-top: 5px; display: block; }
        .btn-back {
            background: rgba(255, 255, 255, 0.05); border: 1px solid var(--border-color);
            color: white; padding: 8px 20px; border-radius: 50px; text-decoration: none;
            font-size: 0.8rem; font-weight: 700; margin-bottom: 20px; display: inline-block;
        }
        ::-webkit-scrollbar { height: 8px; width: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg-dark); }
        ::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 10px; }
    </style>
</head>
<body>
    <div class="container-fluid px-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h4 class="fw-bold mb-0">📊 Esteira de <span style="color: var(--accent-blue)">Vendas</span></h4>
            <a href="index.html" class="btn-back">← Dashboard</a>
        </div>
        <div class="kanban-wrapper" id="kanbanBoard"></div>
    </div>

    <script type="module">
        import { db } from './firebase.js';
        import { collection, onSnapshot, query, orderBy, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const formatarMoeda = (v) => new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(v || 0);

        // Lista de Status Atualizada (Removido Aguardando documentação)
        const statusList = [
            "Repescagem", "Lead novo", "Primeiro contato", "Em negociação", "Reunião agendada", 
            "Cliente Futuro", "Aguardando pagamento", "Venda", "Perdido"
        ];

        function initDragAndDrop() {
            document.querySelectorAll('.kanban-items').forEach(col => {
                new Sortable(col, {
                    group: 'shared',
                    animation: 150,
                    ghostClass: 'sortable-ghost',
                    onEnd: async (evt) => {
                        const leadId = evt.item.getAttribute('data-id');
                        const novoStatus = evt.to.parentElement.getAttribute('data-status');
                        if (leadId && novoStatus) {
                            await updateDoc(doc(db, "clientes", leadId), { situacao: novoStatus });
                        }
                    }
                });
            });
        }

        onSnapshot(query(collection(db, "clientes"), orderBy("timestamp", "desc")), (snapshot) => {
            const dados = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            const board = document.getElementById('kanbanBoard');
            board.innerHTML = "";

            statusList.forEach(status => {
                const idFormatado = status.replace(/ /g, "-");
                const clientesNoStatus = dados.filter(c => c.situacao === status);
                
                const coluna = document.createElement('div');
                coluna.className = `kanban-column`;
                coluna.setAttribute('data-status', status);

                coluna.innerHTML = `
                    <div class="column-header">
                        <p class="column-title">${status}</p>
                        <span class="column-count">${clientesNoStatus.length} Leads</span>
                    </div>
                    <div class="kanban-items" id="items-${idFormatado}">
                        ${clientesNoStatus.map(c => {
                            const foneLimpo = c.telefone ? c.telefone.replace(/\D/g, '') : '';
                            return `
                            <div class="kanban-card" data-id="${c.id}" ondblclick="window.location.href='detalhes.html?id=${c.id}'">
                                <span class="card-name">${c.nome}</span>
                                <span class="card-info"><span class="label-mini">Vendedor:</span> ${c.vendedor || '---'}</span>
                                <span class="card-info"><span class="label-mini">Bem:</span> ${c.bemDesejado || '---'}</span>
                                <a href="https://wa.me/55${foneLimpo}" target="_blank" class="whatsapp-btn">
                                    <i class="fab fa-whatsapp"></i> ${c.telefone || 'Sem número'}
                                </a>
                                <span class="card-value"><span class="label-mini">Valor desejado:</span><br>${formatarMoeda(c.valorDoBem || c.valorCausa)}</span>
                            </div>
                            `;
                        }).join('')}
                    </div>
                `;
                board.appendChild(coluna);
            });
            initDragAndDrop();
        });
    </script>
</body>
</html>
