<!DOCTYPE html>
<html lang="pt-br" class="notranslate" translate="no">
<head>
    <meta charset="UTF-8">
    <meta name="google" content="notranslate">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRM Elite - Gestão de Vendas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://unpkg.com/imask"></script>
    <style>
        :root {
            --bg-dark: #020617; --card-dark: #0f172a; --accent-blue: #38bdf8;
            --accent-glow: #0ea5e9; --text-main: #f1f5f9; --border-color: #1e293b; --input-bg: #020617;
        }
        body { background-color: var(--bg-dark); color: var(--text-main); font-family: 'Inter', sans-serif; }
        .navbar { background-color: var(--card-dark) !important; border-bottom: 1px solid var(--border-color); padding: 1rem 0; }
        
        .dashboard-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 0.8rem; margin-bottom: 2rem; }
        .stat-card { 
            background: linear-gradient(145deg, #1e293b, #0f172a); 
            border: 1px solid var(--border-color); border-radius: 12px; padding: 1rem; 
            text-align: center;
        }
        .stat-value { font-size: 1.4rem; font-weight: 800; color: var(--accent-blue); display: block; }
        .stat-label { font-size: 0.6rem; font-weight: 700; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.5px; }

        .alert-panel { 
            background: rgba(239, 68, 68, 0.05); border: 1px solid rgba(239, 68, 68, 0.2); 
            border-radius: 16px; padding: 20px; margin-bottom: 2rem; display: none;
        }
        .alert-item { 
            background: #1e1b4b; border-left: 4px solid #ef4444; 
            padding: 10px 15px; border-radius: 8px; margin-bottom: 8px;
            display: flex; justify-content: space-between; align-items: center;
        }

        .reuniao-hoje { 
            background: rgba(56, 189, 248, 0.15) !important; 
            box-shadow: inset 0 0 15px rgba(56, 189, 248, 0.2);
            animation: pulse-border 2s infinite;
        }
        @keyframes pulse-border {
            0% { border-left: 4px solid var(--accent-blue); }
            50% { border-left: 4px solid transparent; }
            100% { border-left: 4px solid var(--accent-blue); }
        }

        .actions-menu-row {
            display: flex; gap: 12px; margin-bottom: 1.5rem; flex-wrap: wrap;
        }
        .btn-modern-action {
            background: var(--card-dark); border: 1px solid var(--border-color);
            color: #fff; padding: 10px 20px; border-radius: 10px; font-weight: 700; font-size: 0.8rem;
            text-decoration: none; display: flex; align-items: center; gap: 10px; transition: 0.3s; cursor: pointer;
        }
        .btn-modern-action:hover { border-color: var(--accent-blue); color: var(--accent-blue); background: rgba(56, 189, 248, 0.05); }
        .btn-active-filter { border-color: var(--accent-blue); background: rgba(56, 189, 248, 0.15); color: var(--accent-blue); }

        .form-section { background-color: var(--card-dark); border-radius: 16px; border: 1px solid var(--border-color); padding: 2rem; margin-bottom: 2rem; }
        .custom-label { font-size: 0.7rem; font-weight: 700; color: #64748b; margin-bottom: 8px; text-transform: uppercase; }
        .form-control, .form-select { background-color: var(--input-bg); border: 1px solid var(--border-color); color: white; border-radius: 10px; height: 45px; }
        .form-control:focus, .form-select:focus { border-color: var(--accent-blue); box-shadow: 0 0 10px rgba(56, 189, 248, 0.2); background-color: var(--input-bg); color: white; }

        .btn-cadastrar {
            background: linear-gradient(135deg, #0ea5e9 0%, #0284c7 100%);
            border: none; color: white; font-weight: 800; letter-spacing: 1px;
            height: 45px; border-radius: 10px; text-transform: uppercase;
            box-shadow: 0 4px 15px rgba(14, 165, 233, 0.3); transition: all 0.3s ease;
        }
        .btn-cadastrar:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(14, 165, 233, 0.4); opacity: 0.9; color: white; }

        .table-container { background-color: var(--card-dark); border-radius: 16px; border: 1px solid var(--border-color); overflow: hidden; }
        .table { width: 100%; color: var(--text-main); font-size: 0.85rem; }
        .select-status { appearance: none; background: #020617; border: 1px solid var(--border-color); border-radius: 50px; padding: 5px 10px; font-size: 0.7rem; font-weight: 800; cursor: pointer; color: var(--accent-blue); }
    </style>
</head>
<body>

<nav class="navbar navbar-dark mb-4">
    <div class="container-fluid px-5">
        <span class="navbar-brand fw-bold">⚖ CRM <span style="color: var(--accent-blue)">ELITE</span></span>
        <button id="btnSair" class="btn btn-outline-danger btn-sm px-4 rounded-pill">Sair</button>
    </div>
</nav>

<div class="container-fluid px-5">
    <div class="dashboard-row">
        <div class="stat-card"><span class="stat-value" id="countLeadNovo">0</span><span class="stat-label">Lead Novo</span></div>
        <div class="stat-card"><span class="stat-value" id="countPrimeiroContato">0</span><span class="stat-label">1º Contato</span></div>
        <div class="stat-card"><span class="stat-value" id="countNegociacao">0</span><span class="stat-label">Negociação</span></div>
        <div class="stat-card"><span class="stat-value" id="countReuniaoAgendada">0</span><span class="stat-label">Reunião</span></div>
        <div class="stat-card"><span class="stat-value" id="countClienteFuturo" style="color: #fbbf24;">0</span><span class="stat-label">Cli. Futuro</span></div>
        <div class="stat-card"><span class="stat-value" id="countDocs">0</span><span class="stat-label">Doc.</span></div>
        <div class="stat-card"><span class="stat-value" id="countPagamento">0</span><span class="stat-label">Pagamento</span></div>
        <div class="stat-card"><span class="stat-value text-success" id="countVenda">0</span><span class="stat-label">Venda</span></div>
        <div class="stat-card"><span class="stat-value text-danger" id="countDeclinado">0</span><span class="stat-label">Declinado</span></div>
        <div class="stat-card"><span class="stat-value" id="countRepescagem" style="color: #a855f7;">0</span><span class="stat-label">Repescagem</span></div>
    </div>

    <div id="painelAlertas" class="alert-panel">
        <h6 class="text-danger fw-bold mb-3">⚠️ ATENÇÃO: PRAZOS PARA HOJE</h6>
        <div id="listaAlertas"></div>
    </div>

    <div class="actions-menu-row">
        <a href="agenda.html" class="btn-modern-action">📅 Agenda</a>
        <button id="btnFiltroReuniao" class="btn-modern-action">📅 Ver Reuniões de Hoje</button>
        <button id="btnExportar" class="btn-modern-action">📤 Exportar Relatório</button>
        <a href="esteira.html" class="btn-modern-action">📊 Ver Esteira de Vendas</a>
        <a href="equipe.html" class="btn-modern-action" style="border-color: var(--accent-glow)">👥 Gestão de Equipe</a>
    </div>

    <div class="form-section">
        <div class="row g-3">
            <div class="col-md-2 d-flex flex-column"><label class="custom-label">Nome</label><input type="text" id="nome" class="form-control" placeholder="Nome do Lead"></div>
            <div class="col-md-2 d-flex flex-column"><label class="custom-label">Telefone</label><input type="text" id="telefone" class="form-control" placeholder="99 99999-9999"></div>
            <div class="col-md-2 d-flex flex-column"><label class="custom-label">E-mail</label><input type="email" id="email" class="form-control" placeholder="exemplo@email.com"></div>
            <div class="col-md-2 d-flex flex-column">
                <label class="custom-label">Vendedor Responsável</label>
                <select id="vendedor" class="form-select">
                    <option value="">Selecione...</option>
                </select>
            </div>
            <div class="col-md-2 d-flex flex-column">
                <label class="custom-label">Bem desejado</label>
                <select id="bemDesejado" class="form-select">
                    <option value="Imóvel">Imóvel</option><option value="Auto">Auto</option><option value="Moto">Moto</option><option value="Pesados">Pesados</option>
                </select>
            </div>
            <div class="col-md-1 d-flex flex-column"><label class="custom-label">Valor</label><input type="text" id="valorDoBem" class="form-control" placeholder="R$ 0,00"></div>
            <div class="col-md-1 d-flex flex-column"><label class="custom-label">&nbsp;</label> <button id="btnSalvar" class="btn btn-cadastrar w-100">OK</button></div>
        </div>
    </div>

    <div class="mb-4">
        <input type="text" id="inputBusca" class="form-control" style="background:#0f172a" placeholder="🔍 Buscar por nome, telefone ou vendedor...">
    </div>

    <div class="table-container">
        <table class="table table-dark table-hover mb-0">
            <thead>
                <tr>
                    <th class="ps-4">Data</th><th>Nome</th><th>Telefone</th><th>Vendedor</th><th>Bem</th><th>Valor</th><th>Status Funil</th><th class="text-center">Ação</th>
                </tr>
            </thead>
            <tbody id="listaClientes"></tbody>
        </table>
    </div>
</div>

<script type="module">
    import { db, auth } from './firebase.js';
    import { collection, addDoc, onSnapshot, doc, updateDoc, deleteDoc, query, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
    import { signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

    onAuthStateChanged(auth, (user) => { if (!user) window.location.href = "login.html"; });

    const maskTelefone = IMask(document.getElementById('telefone'), { mask: '00 00000-0000' });
    const maskValor = IMask(document.getElementById('valorDoBem'), {
        mask: 'R$ num',
        blocks: { num: { mask: Number, thousandsSeparator: '.', padFractionalZeros: true, radix: ',', mapToRadix: ['.'] } }
    });

    const formatarMoeda = (v) => new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(v || 0);

    let filtroReuniaoAtivo = false;

    onSnapshot(collection(db, "vendedores"), (snapshot) => {
        const select = document.getElementById('vendedor');
        const valorAtual = select.value;
        select.innerHTML = '<option value="">Selecione...</option>';
        snapshot.forEach(doc => {
            const v = doc.data();
            if(v.ativo !== false) select.innerHTML += `<option value="${v.nome}">${v.nome}</option>`;
        });
        select.value = valorAtual;
    });

    document.getElementById('btnSalvar').onclick = async () => {
        const nome = document.getElementById('nome').value;
        const tel = maskTelefone.unmaskedValue;
        const vend = document.getElementById('vendedor').value;
        if(!nome || tel.length < 11 || !vend) return alert("Preencha Nome, Telefone e Vendedor");

        await addDoc(collection(db, "clientes"), {
            data: new Date().toLocaleDateString('pt-BR'),
            nome,
            telefone: maskTelefone.value,
            email: document.getElementById('email').value || '---',
            vendedor: vend,
            bemDesejado: document.getElementById('bemDesejado').value,
            valorDoBem: maskValor.unmaskedValue ? parseFloat(maskValor.unmaskedValue) : 0,
            situacao: "Lead novo",
            timestamp: Date.now(),
            proximoPrazo: ""
        });
        
        document.getElementById('nome').value = '';
        maskTelefone.value = '';
        document.getElementById('email').value = '';
        maskValor.value = '';
    };

    window.atualizarDado = async (id, campo, valor) => {
        await updateDoc(doc(db, "clientes", id), { [campo]: valor });
    };

    let todosOsDados = [];
    onSnapshot(query(collection(db, "clientes"), orderBy("timestamp", "desc")), (snapshot) => {
        todosOsDados = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
        renderizar();
    });

    function renderizar() {
        const termo = document.getElementById('inputBusca').value.toLowerCase();
        const lista = document.getElementById('listaClientes');
        const listaAlertas = document.getElementById('listaAlertas');
        const painelAlertas = document.getElementById('painelAlertas');
        
        lista.innerHTML = ""; listaAlertas.innerHTML = "";
        
        // Contadores atualizados
        let contadores = { 
            "Lead novo": 0, "Primeiro contato": 0, "Em negociação": 0, 
            "Reunião agendada": 0, "Cliente Futuro": 0, "Aguardando documentação": 0, 
            "Aguardando pagamento": 0, "Venda": 0, "Declinado": 0, "Repescagem": 0 
        };

        const hoje = new Date().toISOString().split('T')[0];
        let alertasCount = 0;

        todosOsDados.forEach((c) => {
            if (contadores.hasOwnProperty(c.situacao)) contadores[c.situacao]++;
            
            const isPrazoHoje = c.proximoPrazo === hoje;
            const isReuniaoHoje = c.situacao === "Reunião agendada" && isPrazoHoje;

            if(isPrazoHoje) {
                alertasCount++;
                const prefixo = isReuniaoHoje ? "📅 REUNIÃO AGENDADA: " : "";
                listaAlertas.innerHTML += `<div class="alert-item" style="${isReuniaoHoje ? 'border-left-color: var(--accent-blue); background: #0c4a6e;' : ''}"><span><strong>${prefixo}${c.nome}</strong> - Follow-up hoje!</span><a href="detalhes.html?id=${c.id}" class="btn btn-sm btn-light fw-bold">Ver</a></div>`;
            }

            let mostrar = true;
            if (filtroReuniaoAtivo) {
                mostrar = isReuniaoHoje;
            } else {
                mostrar = (c.nome.toLowerCase().includes(termo) || c.telefone.includes(termo) || (c.vendedor && c.vendedor.toLowerCase().includes(termo)));
            }

            if (mostrar) {
                lista.innerHTML += `
                    <tr class="${isReuniaoHoje ? 'reuniao-hoje' : ''}">
                        <td class="ps-4 small text-secondary">${c.data}</td>
                        <td class="fw-bold">${c.nome} ${isReuniaoHoje ? '📅' : ''}</td>
                        <td class="text-info fw-bold">${c.telefone}</td>
                        <td class="small">${c.vendedor || 'Não inf.'}</td>
                        <td><span class="badge bg-secondary" style="font-size: 0.65rem;">${c.bemDesejado}</span></td>
                        <td class="fw-bold">${formatarMoeda(c.valorDoBem)}</td>
                        <td>
                            <select class="select-status" onchange="window.atualizarDado('${c.id}', 'situacao', this.value)">
                                <option value="Lead novo" ${c.situacao === 'Lead novo' ? 'selected' : ''}>Lead novo</option>
                                <option value="Primeiro contato" ${c.situacao === 'Primeiro contato' ? 'selected' : ''}>1º Contato</option>
                                <option value="Em negociação" ${c.situacao === 'Em negociação' ? 'selected' : ''}>Negociação</option>
                                <option value="Reunião agendada" ${c.situacao === 'Reunião agendada' ? 'selected' : ''}>Reunião agendada</option>
                                <option value="Cliente Futuro" ${c.situacao === 'Cliente Futuro' ? 'selected' : ''}>Cliente Futuro</option>
                                <option value="Aguardando documentação" ${c.situacao === 'Aguardando documentação' ? 'selected' : ''}>Documentação</option>
                                <option value="Aguardando pagamento" ${c.situacao === 'Aguardando pagamento' ? 'selected' : ''}>Pagamento</option>
                                <option value="Venda" ${c.situacao === 'Venda' ? 'selected' : ''}>Venda</option>
                                <option value="Declinado" ${c.situacao === 'Declinado' ? 'selected' : ''}>Declinado</option>
                                <option value="Repescagem" ${c.situacao === 'Repescagem' ? 'selected' : ''}>Repescagem</option>
                            </select>
                        </td>
                        <td class="text-center">
                            <a href="detalhes.html?id=${c.id}" class="btn btn-sm text-info me-2">👁️</a>
                            <button onclick="window.excluir('${c.id}')" class="btn btn-sm text-danger">✕</button>
                        </td>
                    </tr>`;
            }
        });

        // Mapeamento dos IDs do Dashboard atualizado
        const idMap = { 
            "Lead novo": "countLeadNovo", 
            "Primeiro contato": "countPrimeiroContato", 
            "Em negociação": "countNegociacao", 
            "Reunião agendada": "countReuniaoAgendada", 
            "Cliente Futuro": "countClienteFuturo",
            "Aguardando documentação": "countDocs", 
            "Aguardando pagamento": "countPagamento", 
            "Venda": "countVenda", 
            "Declinado": "countDeclinado",
            "Repescagem": "countRepescagem"
        };
        
        Object.keys(contadores).forEach(key => { if(document.getElementById(idMap[key])) document.getElementById(idMap[key]).innerText = contadores[key]; });
        painelAlertas.style.display = alertasCount > 0 ? "block" : "none";
    }

    document.getElementById('btnFiltroReuniao').onclick = function() {
        filtroReuniaoAtivo = !filtroReuniaoAtivo;
        this.classList.toggle('btn-active-filter');
        this.innerText = filtroReuniaoAtivo ? "🔍 Mostrar Todos" : "📅 Ver Reuniões de Hoje";
        renderizar();
    };

    document.getElementById('inputBusca').oninput = () => {
        filtroReuniaoAtivo = false;
        document.getElementById('btnFiltroReuniao').classList.remove('btn-active-filter');
        document.getElementById('btnFiltroReuniao').innerText = "📅 Ver Reuniões de Hoje";
        renderizar();
    };

    document.getElementById('btnExportar').onclick = () => {
        const ws = XLSX.utils.json_to_sheet(todosOsDados.map(c => ({ "Data": c.data, "Nome": c.nome, "Telefone": c.telefone, "Vendedor": c.vendedor, "Email": c.email, "Bem": c.bemDesejado, "Valor": c.valorDoBem, "Status": c.situacao })));
        const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, "Leads_Elite");
        XLSX.writeFile(wb, "CRM_Vendas_Elite.xlsx");
    };

    window.excluir = async (id) => { if(confirm("Excluir Lead?")) await deleteDoc(doc(db, "clientes", id)); };
    document.getElementById('btnSair').onclick = () => signOut(auth);
</script>
</body>
</html>
